version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pertamina_handover_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: handover_pertamina
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pertamina_handover_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pertamina_handover_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://root:rootpassword@mysql:3306/handover_pertamina
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_pertamina_2026
      - REFRESH_SECRET=super_secret_refresh_jwt_key_2026
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/barcodes:/app/barcodes
      - ./backend/logs:/app/logs

volumes:
  mysql_data:
  redis_data:
