version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pertamina_handover_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-handover_pertamina}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pertamina_handover_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pertamina_handover_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-handover_pertamina}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - ALPR_SERVICE_URL=${ALPR_SERVICE_URL:-http://alpr:8000}
      - ALPR_ENABLED=${ALPR_ENABLED:-true}
      - ALPR_ENFORCEMENT_MODE=${ALPR_ENFORCEMENT_MODE:-shadow}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/barcodes:/app/barcodes
      - ./backend/logs:/app/logs

  alpr:
    build:
      context: ./alpr-service
      dockerfile: Dockerfile
    container_name: pertamina_handover_alpr
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ALPR_PORT=8000
      - ALPR_DETECTION_THRESHOLD=0.60
      - ALPR_OCR_THRESHOLD=0.65
      - ALPR_MIN_CONFIDENCE=0.55
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  redis_data:
